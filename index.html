<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="同窗——面向在校大学生的实名同学社交网站演示版：动态、广场、消息与同学主页">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233D6FE8'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'%3E同%3C/text%3E%3C/svg%3E">

<!-- ===== PWA：可安装、可离线 ===== -->
<meta name="theme-color" content="#3D6FE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="同窗">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.svg">

<title>同窗 · 校园社交</title>

<!-- ===== 样式：令牌 → 组件 → 页面 ===== -->
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/views.css">
</head>
<body>

<!-- 顶部导航 -->
<header class="topnav">
  <button class="logo" data-go="home" aria-label="回到首页">
    <span class="logo-mark" aria-hidden="true">同</span><span>同窗</span>
  </button>
  <nav class="nav-center" aria-label="主导航">
    <button class="nav-item" data-go="home">首页</button>
    <button class="nav-item" data-go="plaza">广场</button>
    <button class="nav-item" data-go="msg">消息</button>
    <button class="nav-item" data-go="profile-me">我的</button>
  </nav>
  <div class="nav-right">
    <span class="bell-wrap">
      <button class="icon-btn" data-go="msg" aria-label="通知（有未读时显示红点）" id="bell-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <span class="badge hidden" id="bell-badge"></span>
    </span>
    <button class="nav-avatar-btn" data-go="profile-me" aria-label="我的主页">
      <span class="avatar av-36" id="nav-avatar" style="background:var(--primary)">我</span>
    </button>
  </div>
</header>

<!-- 四个视图由渲染层注入 -->
<main id="app"></main>

<!-- 移动端底部 Tab -->
<nav class="bottomtab" aria-label="底部导航">
  <button class="tab-item" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>首页</button>
  <button class="tab-item" data-go="plaza"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>广场</button>
  <button class="tab-item" data-go="msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>消息<span class="tab-dot hidden" id="tab-badge"></span></button>
  <button class="tab-item" data-go="profile-me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>我的</button>
</nav>

<!-- 全局反馈层 -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<!-- ===== 脚本：核心工具 → 数据 → 渲染 → 交互 → PWA → 启动（defer 保证顺序） ===== -->
<script src="assets/js/core.js" defer></script>
<script src="assets/js/store.js" defer></script>
<script src="assets/js/views.js" defer></script>
<script src="assets/js/interactions.js" defer></script>
<script src="assets/js/pwa.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
